user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/null crit;
events {
    worker_connections 256;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    gzip off;
    include /etc/nginx/conf.d/accord-public.conf;
}
