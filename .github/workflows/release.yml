name: Release

# A SemVer tag on a reviewed commit produces the immutable release assets:
# server tarball (Linux Go + infra), Next bundle (Linux x64) and client
# binaries, all listed in SHA256SUMS. The deploy workflow consumes these.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

env:
  GOCACHE: /home/runner/.cache/go-build
  GOMODCACHE: /home/runner/go/pkg/mod
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-install
      - name: Server release (Linux amd64 Go + infra)
        run: ACCORD_GO="$(command -v go)" infra/accord/build-release.sh
      - name: Next bundle (Linux x64)
        run: infra/accord/build-next.sh
      - name: Client binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 darwin/arm64 darwin/amd64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=''
            [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -buildvcs=true \
              -o "dist/agent-board-$os-$arch$ext" ./cmd/agent-board
          done
      - name: Pack assets
        run: |
          rev=$(git rev-parse HEAD)
          tag=${GITHUB_REF_NAME}
          tar -C ".local/releases/$rev" -czf "dist/accord-$tag-server-linux-amd64.tar.gz" .
          tar -C ".local/releases/$rev-next" -czf "dist/accord-$tag-next-linux-x64.tar.gz" .
          printf '%s\n' "$rev" > dist/REVISION
          (cd dist && sha256sum $(ls | grep -v '^SHA256SUMS$') > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Source revision: $(git rev-parse HEAD)"
